<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Page</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
</head>
<body>
<header>
    <h1><a href="/" class="main">EpyTodo 🏠</a></h1>
    <nav>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
        <a href="/todos/page">Todos</a>
        <a href="/user.html">User</a>
        <a href="/users.html">Users</a>
    </nav>
</header>
<main>
    <h2><span id="firstname">firstname</span> <span id="username">lastname</span></h2>
    <p>email: <span id="useremail">email</span></p>
    <p>id: <span id="userid">id</span></p>
    <p>password: <span id="userpassword">password</span></p>
    <p>created at: <i><span id="userdate">date</span></i></p>
</main>
<footer>
    <p>&copy; 2025 3ls</p>
</footer>
<script>
    async function fetchUserData() {
        const userId = window.location.pathname.split('/')[2]; // Récupère l'ID depuis l'URL

        const response = await fetch(`/users/${userId}`, {
            method: 'GET',
        });

        if (response.ok) {
            const data = await response.json();
            document.getElementById('firstname').textContent = data.firstname;
            document.getElementById('username').textContent = data.name;
            document.getElementById('useremail').textContent = data.email;
            document.getElementById('userid').textContent = data.id;
            document.getElementById('userpassword').textContent = data.password;
            document.getElementById('userdate').textContent = data.created_at;
        } else {
            alert('User not found or an error occurred.');
        }
    }

    fetchUserData();
</script>
</body>
</html>
