<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
</head>
<body>
<header>
    <h1><a href="/" class="main">EpyTodo 🏠</a></h1>
    <nav>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
        <a href="/todos/page">Todos</a>
        <a href="/user.html">User</a>
        <a href="/users.html">Users</a>
    </nav>
</header>
<main>
    <form id="taskForm" class="user-form">
        <p>Task ID: <span id="taskId">ID</span></p>
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            <input type="text" id="description" name="description" required>
        </div>
        <div class="form-group">
            <label for="due_time">Due Time:</label>
            <input type="date" id="due_time" name="due_time" required>
        </div>
        <div class="form-group">
            <label for="user_id">User ID:</label>
            <input type="number" id="user_id" name="user_id" required>
        </div>
        <div class="form-group">
            <label for="status-list">Status:</label>
            <select id="status-list" name="status-list">
                <option value="not started">not started</option>
                <option value="todo">to do</option>
                <option value="in progress">in progress</option>
                <option value="done">done</option>
            </select>
        </div>
        <button type="submit">Update Task</button>
        <button type="button" id="deleteButton" style="background-color: red; color: white;">Delete Task</button>
    </form>
</main>
<footer>
    <p>&copy; 2025 3ls</p>
</footer>
<script>
    // Fonction pour récupérer les données de la tâche
async function fetchTaskData() {
    const urlParams = new URLSearchParams(window.location.search); // Récupère les paramètres de l'URL
    const taskId = urlParams.get('id'); // Récupère l'ID de la tâche

    if (!taskId) {
        alert('No task ID provided.');
        return;
    }

    try {
        const response = await fetch(`/todos/${taskId}`, { method: 'GET' });

        if (response.ok) {
            const data = await response.json();

            // Affiche les données dans les éléments HTML
            document.getElementById('taskId').textContent = data.id;
            document.getElementById('title').value = data.title;
            document.getElementById('description').value = data.description;
            document.getElementById('due_time').value = data.due_time.split('T')[0]; // Formate la date
            document.getElementById('user_id').value = data.user_id;
            document.getElementById('status-list').value = data.status;
        } else {
            alert('Task not found or an error occurred.');
        }
    } catch (error) {
        console.error('Error fetching task data:', error);
        alert('An error occurred while fetching task data.');
    }
}

    // Fonction pour gérer la mise à jour de la tâche
    async function handleFormSubmit(event) {
        event.preventDefault(); // Empêche le comportement par défaut du formulaire

        const taskId = document.getElementById('taskId').textContent; // Récupère l'ID de la tâche
        const formData = {
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            due_time: document.getElementById('due_time').value,
            user_id: document.getElementById('user_id').value,
            status: document.getElementById('status-list').value,
        };

        try {
            const response = await fetch(`/todos/${taskId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData),
            });

            if (response.ok) {
                alert('Task updated successfully!');
                window.location.href = '/todos/page'
            } else {
                alert('Failed to update task.');
            }
        } catch (error) {
            console.error('Error updating task:', error);
            alert('An error occurred while updating task data.');
        }
    }

    // Fonction pour gérer la suppression de la tâche
    async function handleDeleteTask() {
        const taskId = document.getElementById('taskId').textContent; // Récupère l'ID de la tâche

        if (confirm('Are you sure you want to delete this task?')) {
            try {
                const response = await fetch(`/todos/${taskId}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    alert('Task deleted successfully!');
                    window.location.href = '/todos/page'; // Redirige après suppression
                } else {
                    alert('Failed to delete task.');
                }
            } catch (error) {
                console.error('Error deleting task:', error);
                alert('An error occurred while deleting the task.');
            }
        }
    }

    // Attache les événements et initialise les données
    document.addEventListener('DOMContentLoaded', () => {
        fetchTaskData(); // Charge les données de la tâche
        document.getElementById('taskForm').addEventListener('submit', handleFormSubmit); // Gère la soumission du formulaire
        document.getElementById('deleteButton').addEventListener('click', handleDeleteTask); // Gère la suppression de la tâche
    });
</script>
</body>
</html>
