<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Page</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
</head>
<body>
<header>
    <h1><a href="/" class="main">EpyTodo 🏠</a></h1>
    <nav>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
        <a href="/todos/page">Todos</a>
        <a href="/user.html">User</a>
        <a href="/users.html">Users</a>
    </nav>
</header>
<main>
    <form id="userForm" class="user-form">

        <p>firstname: <span id="userfirstname">firstname</span></p>
        <div class="form-group">
            <label for="firstname">modify:</label>
            <input type="text" id="firstname" name="firstname" required>
        </div>
        <p>lastname: <span id="username">lastname</span></p>
        <div class="form-group">
            <label for="name">modify:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <p>email: <span id="useremail">email</span></p>
        <div class="form-group">
            <label for="email">modify:</label>
            <input type="text" id="email" name="email" required>
        </div>
        <p>password: <span id="userpassword">password</span></p>
        <div class="form-group">
            <label for="password">modify:</label>
            <input type="text" id="password" name="password" required>
        </div>
        <button type="submit">Submit</button>
        <button type="button" id="deleteButton" style="background-color: red; color: white;">Delete User</button>
    </form>
</main>
<footer>
    <p>&copy; 2025 3ls</p>
</footer>
<script>
    // Fonction pour récupérer les données de l'utilisateur
    async function fetchUserData() {
        const userId = window.location.pathname.split('/')[2]; // Récupère l'ID depuis l'URL

        try {
            const response = await fetch(`/users/${userId}`, { method: 'GET' });

            if (response.ok) {
                const data = await response.json();

                // Affiche les données dans les éléments HTML
                document.getElementById('userfirstname').textContent = data.firstname;
                document.getElementById('username').textContent = data.name;
                document.getElementById('useremail').textContent = data.email;
                document.getElementById('userpassword').textContent = data.password;

                // Remplit les champs du formulaire avec les valeurs actuelles
                document.getElementById('firstname').value = data.firstname;
                document.getElementById('name').value = data.name;
                document.getElementById('email').value = data.email;
                document.getElementById('password').value = data.password;

                // Ajoute l'ID dans l'attribut data-user-id du formulaire
                document.getElementById('userForm').dataset.userId = userId;
            } else {
                alert('User not found or an error occurred.');
            }
        } catch (error) {
            console.error('Error fetching user data:', error);
            alert('An error occurred while fetching user data.');
        }
    }

    // Fonction pour gérer la soumission du formulaire
    async function handleFormSubmit(event) {
        event.preventDefault(); // Empêche le comportement par défaut du formulaire

        const userId = document.getElementById('userForm').dataset.userId; // Récupère l'ID utilisateur
        const formData = {
            firstname: document.getElementById('firstname').value,
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
        };

        try {
            const response = await fetch(`/users/${userId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData),
            });

            if (response.ok) {
                alert('User updated successfully!');
                window.location.href = '/users'
            } else {
                alert('Failed to update user.');
            }
        } catch (error) {
            console.error('Error updating user:', error);
            alert('An error occurred while updating user data.');
        }
    }

    // Attache les événements et initialise les données
    document.addEventListener('DOMContentLoaded', () => {
        fetchUserData(); // Charge les données de l'utilisateur
        document.getElementById('userForm').addEventListener('submit', handleFormSubmit); // Gère la soumission du formulaire
    });

    async function handleDeleteUser() {
        const userId = document.getElementById('userForm').dataset.userId; // Récupère l'ID utilisateur

        if (confirm('Are you sure you want to delete this user?')) {
            try {
                const response = await fetch(`/users/${userId}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    alert('User deleted successfully!');
                    //window.location.href = '/users';
                } else {
                    alert('Failed to delete user.');
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('An error occurred while deleting the user.');
            }
        }
    }

    // Attache l'événement au bouton "Delete"
    document.getElementById('deleteButton').addEventListener('click', handleDeleteUser);
</script>
</body>
</html>
