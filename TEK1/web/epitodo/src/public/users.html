<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users List</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
</head>
<body>
<header>
    <h1><a href="/" class="main">EpyTodo 🏠</a></h1>
    <nav>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
        <a href="/todos/page">Todos</a>
        <a href="/user.html">User</a>
        <a href="/users.html">Users</a>
    </nav>
</header>
<main>
    <h2>Users List</h2>
    <ul id="usersList">
        <!-- Les utilisateurs seront ajoutés ici dynamiquement -->
    </ul>
</main>
<footer>
    <p>&copy; 2025 EpyTodo</p>
</footer>
<script>
    // Fonction pour récupérer la liste des utilisateurs
    async function fetchUsers() {
        try {
            const response = await fetch('/users/api', { method: 'GET' });

            if (response.ok) {
                const users = await response.json();
                const usersList = document.getElementById('usersList');

                // Ajoute chaque utilisateur à la liste
                users.forEach(user => {
                    const listItem = document.createElement('li');
                    const userLink = document.createElement('a');
                    userLink.href = `/users/${user.id}/page`; // Lien vers la page de l'utilisateur
                    userLink.textContent = `${user.firstname} ${user.name} (${user.email})`;
                    listItem.appendChild(userLink);
                    usersList.appendChild(listItem);
                });
            } else {
                alert('Failed to fetch users.');
            }
        } catch (error) {
            console.error('Error fetching users:', error);
            alert('An error occurred while fetching users.');
        }
    }

    // Charge la liste des utilisateurs au chargement de la page
    document.addEventListener('DOMContentLoaded', fetchUsers);
</script>
</body>
</html>
