name: Chocolatine 

on:
  push:
    branches-ignore:
      - 'ga-ignore-*'
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'

env:
  MIRROR_URL: "git@github.com:EpitechPGEPromo2029/B-DOP-200-LIL-2-1-chocolatine-logan.capoen.git"
  EXECUTABLES: "mysh"

jobs:
  check_if_mirror_repo:
    runs-on: ubuntu-latest
    outputs:
      is_mirror: ${{ steps.check_repo.outputs.is_mirror }}
    steps:
      - name: Check if we are in the mirror repository
        id: check_repo
        run: |
          if [ "${{ github.repository }}" == "EpitechPGEPromo2029/B-DOP-200-LIL-2-1-chocolatine-logan.capoen" ]; then
            echo "This is the mirror repository. Stopping the workflow."
            echo "is_mirror=true" >> $GITHUB_OUTPUT
          else
            echo "is_mirror=false" >> $GITHUB_OUTPUT
          fi
  check_coding_style:
    runs-on: ubuntu-latest
    container: ghcr.io/epitech/coding-style-checker:latest
    needs: check_if_mirror_repo
    if: ${{ needs.check_if_mirror_repo.outputs.is_mirror == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run coding style check
        run: check.sh $(pwd) $(pwd)
      - name: Display coding style errors
        if: ${{ hashFiles('coding-style-reports.log') != '' }}
        run: |
          if [ ! -s coding-style-reports.log ]; then
            echo "No coding style error."
            exit 0
          fi
          while IFS=':' read -r file line error msg; do
            error=$(echo "$error" | xargs)
            echo "::error file=$file,line=$line,title=${error} coding style error::$msg"
          done < coding-style-reports.log
          exit -1

  check_program_compilation:
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    needs: check_coding_style
    if: ${{ needs.check_if_mirror_repo.outputs.is_mirror == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Compile program
        timeout-minutes: 2
        run: make
      - name: Clean build
        run: make clean
      - name: Check executables
        run: |
          IFS=',' read -r EXECS << "$EXECUTABLES"
          for exec in "${EXECS[@]}"; do
            if [ ! -x "$exec" ]; then
              echo "::error file=$exec::Missing or non-executable $exec"
              exit -1
            fi
          done

  run_tests:
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    needs: check_program_compilation
    if: ${{ needs.check_if_mirror_repo.outputs.is_mirror == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run tests
        run: timeout 120 make tests_run

  push_to_mirror:
    runs-on: ubuntu-latest
    needs: run_tests
    if: ${{ needs.check_if_mirror_repo.outputs.is_mirror == 'false' }}
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}