# Squirtle Showroom Scene
camera:
{
    resolution = { width = 1080.0; height = 1080.0; };
    # On recule un peu et on monte pour une vue de 3/4
    position = { x = 0.0; y = 0.0; z = 0.0; }; 
    rotation = { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 50.0; # FOV plus serré pour un effet "portrait"
};

materials = (
    {
        name = "studio_floor";
        type = "mat"; # Si ton moteur gère le "refraction" ou "reflection", ajoute-le ici
        color = { r = 40; g = 44; b = 52; }; # Gris foncé type studio
    },
    {
        name = "squirtle_mat";
        type = "mat";
        color = { r = 255; g = 255; b = 255; }; # On laisse le MTL gérer les couleurs
    }
);

primitives:
{
    obj = (
        {
            x = 0.0; y = -0.5; z = 0.0; 
            rotation = { x = 0.0; y = 0.0; z = 0.0; }; 
            path = "scenes/squirtle"; 
            material = "squirtle_mat";
        }
    );

    planes = (
        { 
            x = 0.0; y = -0.5; z = 0.0; 
            normal = { x = 0.0; y = 1.0; z = 0.0; }; 
            material = "studio_floor"; 
        }
    );
};

lights:
{
    # 1. Key Light : Lumière principale chaude venant de la gauche
    directional = (
        { 
            x = -1.0; y = -1.0; z = -0.5; 
            intensity = 0.8; 
            color = { r = 255; g = 240; b = 200; }; 
        },
        # 2. Fill Light : Lumière bleutée douce pour déboucher les ombres à droite
        { 
            x = 1.0; y = -0.5; z = -0.2; 
            intensity = 0.4; 
            color = { r = 180; g = 200; b = 255; }; 
        }
    );

    # 3. Point Light : Pour créer un éclat sur la carapace/les yeux
    point = (
        {
            x = 0.0; y = 1.5; z = 1.0;
            intensity = 1.2;
            color = { r = 255; g = 255; b = 255; };
        }
    );
};